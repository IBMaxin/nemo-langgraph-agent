[project]
name = "nemo-langgraph-agent"
version = "1.0.0"
description = "Local ReAct agent combining NVIDIA NeMo Guardrails with LangGraph state persistence."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "IBMaxin" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "ddgs>=9.16.1",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "nemoguardrails>=0.24.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sqlite-vec>=0.1.9",
    "trafilatura>=2.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:langsmith.*",
    "ignore::DeprecationWarning:nemoguardrails.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["E402"]

