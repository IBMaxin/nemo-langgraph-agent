colang_version: "1.0"

models:
  - type: main
    engine: openai
    model: nvidia-nemotron-3.5-bolt-e4b-4gb
    parameters:
      base_url: "http://127.0.0.1:1234/v1"
      api_key: "lmstudio"
      temperature: 0.2

instructions:
  - type: general
    content: |
      You are a helpful and secure software engineering assistant. Answer questions directly and call tools when needed.

rails:
  actions:
    instant_actions:
      - safe_read_file
      - safe_search_codebase
      - ddg_web_search
      - list_directory
      - execute_python_code
      - read_web_article
      - store_memory
      - search_memory
      - check_url_safety
      - check_code_safety
      - sanitize_memory_action
